<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="220" fill="#2563eb" opacity="0.12"/>
  <circle cx="170" cy="650" r="260" fill="#14b8a6" opacity="0.10"/>

  <text x="70" y="76" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">KG-Agent Research Assistant</text>
  <text x="70" y="112" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">从一个模糊选题，自动拆解、检索、补证、验证，生成可落地的研究问题</text>

  <rect x="70" y="145" width="1060" height="510" rx="22" fill="#020617" stroke="#334155" filter="url(#shadow)"/>
  <rect x="70" y="145" width="1060" height="58" rx="22" fill="#0f172a"/>
  <circle cx="105" cy="174" r="7" fill="#ef4444"/>
  <circle cx="130" cy="174" r="7" fill="#f59e0b"/>
  <circle cx="155" cy="174" r="7" fill="#22c55e"/>
  <text x="190" y="181" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">回答模式：研究助手 · Research Workflow</text>

  <rect x="102" y="226" width="452" height="96" rx="16" fill="#1e293b" stroke="#334155"/>
  <text x="128" y="260" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">用户问题</text>
  <text x="128" y="292" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">Agentic RAG 在 2026 年还有哪些</text>
  <text x="128" y="316" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="16">最新研究空白？给出可做研究问题。</text>

  <rect x="610" y="226" width="472" height="360" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="636" y="260" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">研究助手输出</text>
  <text x="636" y="294" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">研究空白</text>
  <text x="636" y="321" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">Agentic RAG 面对超出知识库范围的问题时，</text>
  <text x="636" y="345" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">如何主动建议可回答的替代查询，仍缺少系统研究。</text>

  <text x="636" y="392" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">可做研究问题</text>
  <text x="636" y="419" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">如何设计动态查询建议机制，在问题不可回答时</text>
  <text x="636" y="443" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">生成语义相近、知识库可支撑的替代问题？</text>

  <text x="636" y="492" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">证据与验证</text>
  <rect x="636" y="510" width="96" height="30" rx="15" fill="#064e3b" stroke="#10b981"/>
  <text x="657" y="531" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="13">联网证据 2</text>
  <rect x="744" y="510" width="116" height="30" rx="15" fill="#312e81" stroke="#818cf8"/>
  <text x="762" y="531" fill="#c7d2fe" font-family="Inter, Arial, sans-serif" font-size="13">支撑度 67%</text>
  <rect x="872" y="510" width="124" height="30" rx="15" fill="#451a03" stroke="#f59e0b"/>
  <text x="890" y="531" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="13">部分支撑</text>

  <rect x="102" y="358" width="452" height="228" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="128" y="392" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">可观测执行轨迹</text>
  <g font-family="Inter, Arial, sans-serif" font-size="14">
    <circle cx="138" cy="430" r="8" fill="#22c55e"/><text x="160" y="435" fill="#cbd5e1">识别意图：研究空白分析</text>
    <circle cx="138" cy="468" r="8" fill="#22c55e"/><text x="160" y="473" fill="#cbd5e1">本地检索：证据不足</text>
    <circle cx="138" cy="506" r="8" fill="#22c55e"/><text x="160" y="511" fill="#cbd5e1">联网补证：接受 2 条学术证据</text>
    <circle cx="138" cy="544" r="8" fill="#22c55e"/><text x="160" y="549" fill="#cbd5e1">引用验证：部分支撑，提示谨慎使用</text>
  </g>

  <text x="70" y="692" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Mock screenshot for GitHub documentation · Based on real research workflow output</text>
</svg>
