    <rect x="892" y="278" width="58" height="20" rx="10" fill="#472E1B" opacity="0.96"/>
    <text x="921" y="292" fill="#FFEBC5" text-anchor="middle" font-size="11">证据链</text>

    <path d="M805 264 C768 238 768 224 805 210" stroke="#A77BFF" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.95"/>
