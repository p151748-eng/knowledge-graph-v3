<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#061128"/>
      <stop offset="0.46" stop-color="#14235B"/>
      <stop offset="1" stop-color="#063C45"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(910 154) rotate(90) scale(210 260)">
      <stop stop-color="#6BA6FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6BA6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 290) rotate(90) scale(170 220)">
      <stop stop-color="#27D6A3" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#27D6A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroCard" x1="64" y1="58" x2="644" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#223A7A" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#15244C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0E3F42" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="272" x2="594" y2="272" gradientUnits="userSpaceOnUse">
