<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="70" y="76" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Evidence Transparency Panel</text>
  <text x="70" y="112" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="18">答案不是黑盒：每条证据从哪里来、支撑了什么、可信度如何，都能直接看到</text>

  <rect x="70" y="145" width="1060" height="510" rx="22" fill="#020617" stroke="#334155" filter="url(#shadow)"/>
  <rect x="100" y="180" width="500" height="420" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="128" y="220" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">最终回答</text>
  <text x="128" y="260" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">系统建议将研究问题收敛到：</text>
  <text x="128" y="292" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">不可回答查询下的动态查询建议机制</text>
  <text x="128" y="326" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">因为 2026 年已有论文指出，Agentic RAG</text>
  <text x="128" y="350" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="15">在 out-of-scope 问题处理上仍缺少系统研究 [2]。</text>

  <rect x="128" y="402" width="128" height="34" rx="17" fill="#064e3b" stroke="#10b981"/>
  <text x="151" y="425" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="14">已引用 [2]</text>
  <rect x="268" y="402" width="128" height="34" rx="17" fill="#451a03" stroke="#f59e0b"/>
  <text x="291" y="425" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="14">部分支撑</text>

  <rect x="640" y="180" width="460" height="420" rx="16" fill="#0f172a" stroke="#334155"/>
  <text x="668" y="220" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">原始证据列表</text>

  <rect x="668" y="248" width="404" height="128" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="688" y="276" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">AgenticRAGTracer</text>
  <text x="688" y="301" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13">2026 · Semantic Scholar / ai4scholar · 联网</text>
  <text x="688" y="328" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">诊断 Agentic RAG 多步检索推理错误，关注 hop-aware benchmark。</text>
  <text x="688" y="354" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="13">支撑状态：部分支撑 [1]</text>

  <rect x="668" y="398" width="404" height="148" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="688" y="426" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Query Suggestion for RAG</text>
  <text x="688" y="451" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="13">2026 · Semantic Scholar / ai4scholar · 联网</text>
  <text x="688" y="478" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">指出 out-of-scope questions 可能导致 hallucination，</text>
  <text x="688" y="500" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13">并首次研究 query suggestion 来完成用户交互。</text>
  <text x="688" y="526" fill="#34d399" font-family="Inter, Arial, sans-serif" font-size="13">支撑状态：已支撑 [2]</text>

  <text x="70" y="692" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="14">Mock screenshot for GitHub documentation · Shows the newly added original evidence panel</text>
</svg>
