  <text x="128" y="260" fill="#F8FAFC" font-family="Noto Sans SC, Inter, Arial" font-size="18" font-weight="800">用户问题</text>
  <text x="128" y="292" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">请概括这篇论文的研究问题、核心方法、</text>
  <text x="128" y="318" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">实验设计和主要贡献。</text>
  <rect x="102" y="374" width="452" height="212" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="128" y="408" fill="#F8FAFC" font-family="Noto Sans SC, Inter, Arial" font-size="18" font-weight="800">系统正在做什么</text>
  <circle cx="138" cy="430" r="7" fill="#34D399"/><text x="160" y="435" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="14">识别为单篇论文阅读任务</text>
  <circle cx="138" cy="468" r="7" fill="#34D399"/><text x="160" y="473" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="14">检索本地论文分片与章节</text>
  <circle cx="138" cy="506" r="7" fill="#34D399"/><text x="160" y="511" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="14">按方法 / 实验 / 贡献组织回答</text>
  <circle cx="138" cy="544" r="7" fill="#34D399"/><text x="160" y="549" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="14">展示引用片段和来源</text>
  <rect x="610" y="226" width="472" height="360" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="636" y="260" fill="#F8FAFC" font-family="Noto Sans SC, Inter, Arial" font-size="18" font-weight="800">论文助手回答结构</text>
  <text x="636" y="300" fill="#38BDF8" font-family="Noto Sans SC, Inter, Arial" font-size="15" font-weight="700">研究问题</text>
  <text x="636" y="326" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">论文关注 RAG 系统中的事实性、可控性与证据归因。</text>
  <text x="636" y="366" fill="#38BDF8" font-family="Noto Sans SC, Inter, Arial" font-size="15" font-weight="700">核心方法</text>
  <text x="636" y="392" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">通过按需检索与自我反思，让模型判断何时需要外部证据。</text>
  <text x="636" y="432" fill="#38BDF8" font-family="Noto Sans SC, Inter, Arial" font-size="15" font-weight="700">实验与贡献</text>
  <text x="636" y="458" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">在事实问答和开放域任务上提升可靠性，并保留归因能力。</text>
  <rect x="636" y="520" width="105" height="30" rx="15" fill="#064E3B" stroke="#10B981"/><text x="654" y="541" fill="#A7F3D0" font-family="JetBrains Mono, Consolas" font-size="12">paper mode</text>
  <rect x="755" y="520" width="118" height="30" rx="15" fill="#312E81" stroke="#818CF8"/><text x="773" y="541" fill="#C7D2FE" font-family="JetBrains Mono, Consolas" font-size="12">local chunks</text>
  <text x="70" y="692" fill="#64748B" font-family="JetBrains Mono, Consolas" font-size="13">Mock screenshot · Paper Assistant reads local paper evidence</text>
