    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1010" cy="100" r="220" fill="#38BDF8" opacity="0.10"/>
  <circle cx="180" cy="650" r="260" fill="#818CF8" opacity="0.09"/>
  <text x="70" y="76" fill="#F8FAFC" font-family="Noto Sans SC, Inter, Arial" font-size="34" font-weight="800">Paper Assistant · 论文阅读不再从摘要开始猜</text>
  <text x="70" y="112" fill="#94A3B8" font-family="Noto Sans SC, Inter, Arial" font-size="18">导入论文后，直接围绕研究问题、方法、实验和贡献追问</text>
  <rect x="70" y="145" width="1060" height="510" rx="24" fill="#020617" stroke="#334155" filter="url(#shadow)"/>
  <rect x="70" y="145" width="1060" height="58" rx="24" fill="#0f172a"/>
  <circle cx="105" cy="174" r="7" fill="#FB7185"/><circle cx="130" cy="174" r="7" fill="#FBBF24"/><circle cx="155" cy="174" r="7" fill="#34D399"/>
  <text x="190" y="181" fill="#CBD5E1" font-family="JetBrains Mono, Consolas" font-size="14">KG-Agent · paper assistant mode</text>
