  <circle cx="105" cy="174" r="7" fill="#FB7185"/><circle cx="130" cy="174" r="7" fill="#FBBF24"/><circle cx="155" cy="174" r="7" fill="#34D399"/><text x="190" y="181" fill="#CBD5E1" font-family="JetBrains Mono, Consolas" font-size="14">KG-Agent · self-rag verification</text>
  <rect x="102" y="226" width="452" height="116" rx="18" fill="#111827" stroke="#334155"/><text x="128" y="260" fill="#F8FAFC" font-family="Noto Sans SC, Inter, Arial" font-size="18" font-weight="800">用户问题</text><text x="128" y="292" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">这个结论可靠吗？请基于论文和官网依据验证。</text>
