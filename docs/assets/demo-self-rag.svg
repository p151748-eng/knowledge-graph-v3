  <text x="636" y="300" fill="#38BDF8" font-family="Noto Sans SC, Inter, Arial" font-size="15" font-weight="700">支持结论</text><text x="636" y="326" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">核心机制与论文证据一致，可以作为谨慎结论使用。</text>
  <text x="636" y="366" fill="#38BDF8" font-family="Noto Sans SC, Inter, Arial" font-size="15" font-weight="700">需要补证</text><text x="636" y="392" fill="#CBD5E1" font-family="Noto Sans SC, Inter, Arial" font-size="15">泛化到所有场景的说法缺少直接依据。</text>
