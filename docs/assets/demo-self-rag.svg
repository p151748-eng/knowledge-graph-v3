  <text x="70" y="76" fill="#F8FAFC" font-family="Noto Sans SC, Inter, Arial" font-size="34" font-weight="800">Self-RAG · 当你问“这个结论可靠吗？”</text>
  <text x="70" y="112" fill="#94A3B8" font-family="Noto Sans SC, Inter, Arial" font-size="18">系统先检查证据，再决定是否修复检索或联网补证</text>
